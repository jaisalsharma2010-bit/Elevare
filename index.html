      <button type="button" class="quote" id="quote" title="Show another quote"></button>
    </header>

    <main class="stage">
      <section class="view view-focus" id="viewFocus" aria-label="Focus timer">
        <h1 class="intention-wrap">
          <button type="button" class="intention" id="intention">What do you want to focus on?</button>
        </h1>
        <form class="intention-form" id="intentionForm" hidden autocomplete="off">
          <input id="intentionInput" maxlength="140" placeholder="What do you want to focus on?" aria-label="What do you want to focus on?">
          <select id="intentionCategory" aria-label="Category"></select>
          <button type="submit" class="btn solid">Save</button>
        </form>

        <div class="phases" id="phases" role="group" aria-label="Session type">
          <button type="button" data-phase="focus">Focus</button>
          <button type="button" data-phase="short">Short break</button>
          <button type="button" data-phase="long">Long break</button>
        </div>
        <div class="rounds" id="rounds" role="img"></div>

        <div class="timer-display" id="timerDisplay" role="timer"></div>

        <div class="controls">
          <button type="button" class="ctrl primary" id="btnPlay"></button>
          <button type="button" class="ctrl" id="btnReset" aria-label="Reset timer" title="Reset (R)"></button>
          <button type="button" class="ctrl" id="btnMini" aria-label="Mini player" title="Mini player"></button>
        </div>
        <div class="under" id="under"></div>
      </section>

      <section class="view view-home" id="viewHome" aria-label="Home" hidden>
        <p class="greeting" id="greeting"></p>
        <div class="home-clock" id="homeClock"></div>
        <p class="home-date" id="homeDate"></p>
        <p class="home-today" id="homeToday"></p>
      </section>

      <section class="view view-ambient" id="viewAmbient" aria-label="Ambient" hidden>
        <div class="ambient-clock" id="ambientClock"></div>
        <p class="ambient-timer" id="ambientTimer"></p>
      </section>
    </main>

    <nav class="dock dock-left" aria-label="Tools">
      <button type="button" class="tool" data-popover="tasks" aria-label="Tasks" title="Tasks"></button>
      <button type="button" class="tool" data-popover="sounds" aria-label="Sounds" title="Sounds"></button>
      <button type="button" class="tool" data-popover="notes" aria-label="Notes" title="Notes"></button>
    </nav>

    <nav class="dock dock-right" aria-label="App">
      <button type="button" class="tool streak" id="btnStreak"></button>
      <div class="switch" id="viewSwitch" role="group" aria-label="Screen">
        <button type="button" data-view="ambient" aria-label="Ambient screen" title="Ambient"></button>
        <button type="button" data-view="home" aria-label="Home screen" title="Home"></button>
        <button type="button" data-view="focus" aria-label="Focus screen" title="Focus"></button>
      </div>
      <button type="button" class="tool" id="btnSettings" aria-label="Settings" title="Settings (S)"></button>
      <button type="button" class="tool" id="btnFullscreen" aria-label="Full screen" title="Full screen (F)"></button>
    </nav>

    <div class="popover" id="popover" role="dialog" hidden></div>
    <div class="mini" id="mini" hidden></div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1">
      <nav class="panel-nav" id="panelNav" aria-label="Settings sections"></nav>
      <div class="panel-main">
        <header class="panel-head">
          <h2 id="panelTitle"></h2>
          <button type="button" class="icon-btn" id="panelClose" aria-label="Close settings"></button>
        </header>
        <div class="panel-body" id="panelBody"></div>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="drop-veil" id="dropVeil" hidden><p>Drop to use as your background</p></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <noscript><p class="noscript">Elevare needs JavaScript to run.</p></noscript>
